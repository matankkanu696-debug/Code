<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <section>
            <div class="card-tags">
                <div class="tag-fresh">FRESH & ORGANIC</div>

                <div class="info-tags">
                    <div class="info">
                        <img class="card-icon" src="truck.png" alt="">
                        <div>
                            <div>30 MINS</div>
                            <div>DILIVERY</div>
                        </div>
                    </div>
    
                    <div class="info">
                        <img class="card-icon" src="leaf.jpg" alt="">
                        <div>
                            <div>FARM</div>
                            <div>FRESH</div>
                        </div>
                    </div>
                </div>
            </div>

            <img class="card-img" src="apple.jpg" alt="apple">
        </section>

        <h2 class="card-heading">ORGANIC APPLES</h2>

        <section>
            <p class="price-show1">₹180.00 / kg</p>
            <div class="price-show2">
                <p class="mrp-off">MRP: <span>₹220.00</span> <div class="divider"></div> <p class="save">SAVE 18%</p></p>
            </div>
        </section>

        <section class="btn-cont">
            <button class="card-btn weight-btn">WEIGHT: 1 Kg</button>
            <button class="card-btn cart-btn">ADD TO CART</button>
        </section>
    </div>
</body>
</html>
